<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ben tobias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Futura';
      src: local('Futura Bold'), local('Futura-Bold'), local('FuturaBT-Bold');
      font-weight: 700;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fff; font-family: 'DM Sans', sans-serif; color: #111; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 45px 8px 11.5px; max-width: 60vw; margin: 0 auto;
    }
    .nav-home {
      display: flex; align-items: center; gap: 10px; font-size: 19px;
      font-family: 'Futura','Futura PT','Century Gothic','Trebuchet MS',sans-serif;
      font-weight: 700; color: #111; text-decoration: none;
      letter-spacing: -0.05em;
      transition: none;
    }
    .nav-home-arrow { height: 9px; width: auto; display: inline-block; transform: scaleX(-1); }
    .nav-home:hover { color: #f06292; }
    .site-logo { display: block; height: 5.025vw; width: auto; }

    .stage-wrap {
      max-width: 60vw;
      margin: 0 auto;
      padding: 45px 8px 60px;
    }

    /* Single-column stack: each slot is full width, height set by image aspect ratio */
    .stage {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Each slot is always visible as a grey box */
    .slot {
      width: 100%;
      background: #d0d0d0;
      overflow: hidden;
      cursor: pointer;
    }

    /* Images start hidden; revealed individually once loaded */
    .slot img {
      display: block;
      width: 100%;
      height: auto;
      visibility: hidden;
    }

    @media (max-width: 768px) {
      nav {
        padding: 40px 8px 40px;
        max-width: 100%;
        margin: 0;
        padding-left: 28px;
      }
      .nav-home { font-size: 13px; gap: 6px; }
      .nav-home-arrow { height: 7px; }
      .site-logo { height: 40px; }

      .stage-wrap {
        max-width: 100%;
        padding: 0 8px 40px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-home" href="http://tobias.cool"><img class="nav-home-arrow" src="https://ik.imagekit.io/dq3ybf3qb/nav%20arrow%20pink.png?updatedAt=1761779789570" alt="" />home</a>
    <img class="site-logo" src="https://imgtobias.s3.us-east-005.backblazeb2.com/horizontal+logo.png" alt="ben tobias" />
    <div style="width:60px"></div>
  </nav>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="slot"><img id="i1"  src="https://images.tobias.cool/cd01bc.jpg" alt="" fetchpriority="high" /></div>
      <div class="slot"><img id="i2"  src="https://images.tobias.cool/cd02bc.jpg" alt="" fetchpriority="high" /></div>
      <div class="slot"><img id="i3"  src="https://images.tobias.cool/cd03c.jpg" alt="" fetchpriority="high" /></div>
      <div class="slot"><img id="i4"  src="https://images.tobias.cool/cd04c.jpg" alt="" /></div>
      <div class="slot"><img id="i5"  src="https://images.tobias.cool/cd05c.jpg" alt="" /></div>
      <div class="slot"><img id="i6"  src="https://images.tobias.cool/cd06bc.jpg" alt="" /></div>
      <div class="slot"><img id="i7"  src="https://images.tobias.cool/cd07b.gif" alt="" /></div>
      <div class="slot"><img id="i8"  src="https://images.tobias.cool/cd08c.jpg" alt="" /></div>
      <div class="slot"><img id="i9"  src="https://images.tobias.cool/cd09c.jpg" alt="" /></div>
      <div class="slot"><img id="i10" src="https://images.tobias.cool/cd10c.jpg" alt="" /></div>
      <div class="slot"><img id="i11" src="https://images.tobias.cool/cd11c.jpg" alt="" /></div>
      <div class="slot"><img id="i12" src="https://images.tobias.cool/cd12c.jpg" alt="" /></div>
      <div class="slot"><img id="i13" src="https://images.tobias.cool/cd13c.jpg" alt="" /></div>
      <div class="slot"><img id="i14" src="https://images.tobias.cool/cd14c.jpg" alt="" /></div>
      <div class="slot"><img id="i15" src="https://images.tobias.cool/cd15c.jpg" alt="" /></div>
      <div class="slot"><img id="i16" src="https://images.tobias.cool/cd16c.jpg" alt="" /></div>
      <div class="slot"><img id="i17" src="https://images.tobias.cool/cd17c.jpg" alt="" /></div>
      <div class="slot"><img id="i18" src="https://images.tobias.cool/cd18c.jpg" alt="" /></div>
    </div>
  </div>

  <script>
    // ── IMAGE LOADING ─────────────────────────────────────────────────────────
    // Slots are always visible as grey boxes.
    // Each img starts hidden and is revealed only once its image has loaded.

    const imgs = Array.from(document.querySelectorAll('.slot img'));

    function onImgLoad(img) {
      img.style.visibility = 'visible';
    }

    imgs.forEach(img => {
      if (img.complete && img.naturalWidth) {
        img.style.visibility = 'visible';
      } else {
        img.addEventListener('load',  () => onImgLoad(img));
        img.addEventListener('error', () => { /* leave grey on error */ });
      }
    });
  </script>

</body>
</html>
